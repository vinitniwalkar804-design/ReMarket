<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ReMarket — trusted second-hand marketplace." />
  <title>Compare · ReMarket</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script type="module" src="../js/compare.js"></script>
</head>
<body>
<div class="min-h-screen bg-canvas flex flex-col pb-20 md:pb-0">
<header class="sticky top-0 z-50 bg-white/85 backdrop-blur-xl border-b border-line">
  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3 h-[68px]">
      <a href="index.html" class="flex items-center gap-2.5 shrink-0 group">
        <span class="w-9 h-9 rounded-xl bg-primary text-white flex items-center justify-center text-[15px] font-extrabold shadow-glow-primary transition-transform duration-200 group-hover:-translate-y-0.5">R</span>
        <span class="hidden sm:block font-display font-extrabold text-[17px] tracking-tight text-ink-900">Re<span class="text-primary">Market</span></span>
      </a>
      <span class="hidden lg:block w-px h-6 bg-line flex-none"></span>
      <form class="relative flex-1 max-w-2xl lg:mx-2" data-search-form>
  <div class="relative">
    <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-soft pointer-events-none"><span data-icon="Search" data-icon-size="16"></span></div>
    <input type="search" placeholder="Search laptops, phones, books…" aria-label="Search marketplace" data-search-input class="w-full pl-10 pr-20 py-2.5 rounded-xl bg-raised border border-transparent text-sm text-ink-900 placeholder:text-muted-soft outline-none transition-all duration-150 focus:bg-white focus:border-brand-300 focus:shadow-focus" />
    <div class="absolute right-3 top-1/2 -translate-y-1/2" data-search-affix></div>
  </div>
  <div class="absolute left-0 right-0 top-full z-50" data-search-suggest></div>
</form>
      <nav class="hidden xl:flex items-center gap-1 flex-none">
        <a href="products.html" data-nav data-to="/products" class="relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="Compass" data-icon-size="19"></span><span class="hidden min-w-[18px] h-[18px] px-1.5 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center tabular" data-badge></span></span>Explore</a>
        <a href="categories.html" data-nav data-to="/categories" class="relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="LayoutGrid" data-icon-size="19"></span><span class="hidden min-w-[18px] h-[18px] px-1.5 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center tabular" data-badge></span></span>Categories</a>
        <a href="sell.html" data-nav data-to="/sell" class="relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="Tag" data-icon-size="19"></span><span class="hidden min-w-[18px] h-[18px] px-1.5 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center tabular" data-badge></span></span>Sell</a>
        <a href="compare.html" data-nav data-to="/compare" class="relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="ArrowLeftRight" data-icon-size="19"></span><span class="hidden min-w-[18px] h-[18px] px-1.5 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center tabular" data-badge></span></span>Compare</a>
      </nav>
      <div class="flex items-center gap-1 shrink-0">
        <a href="wishlist.html" data-quick data-to="/wishlist" title="Wishlist" aria-label="Wishlist" class="relative w-9 h-9 rounded-lg flex items-center justify-center transition-all duration-150"><span class="relative inline-flex"><span data-icon="Heart" data-icon-size="19"></span><span class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-white" data-badge></span></span></a>
        <a href="messages.html" data-quick data-to="/messages" title="Messages" aria-label="Messages" class="relative w-9 h-9 rounded-lg flex items-center justify-center transition-all duration-150"><span class="relative inline-flex"><span data-icon="MessageCircle" data-icon-size="19"></span><span class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-white" data-badge></span></span></a>
        <a href="cart.html" data-quick data-to="/cart" title="Cart" aria-label="Cart" class="relative w-9 h-9 rounded-lg flex items-center justify-center transition-all duration-150"><span class="relative inline-flex"><span data-icon="ShoppingCart" data-icon-size="19"></span><span class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-white" data-badge></span></span></a>
        <div class="relative" data-notif>
          <button type="button" aria-label="Notifications" class="relative w-9 h-9 rounded-lg flex items-center justify-center transition-all duration-150 text-muted hover:bg-sunken hover:text-ink-900" data-notif-btn>
            <span data-icon="Bell" data-icon-size="19"></span>
            <span class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-danger text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-white" data-notif-badge></span>
          </button>
          <div class="absolute right-0 top-full mt-2 z-50" data-notif-panel></div>
        </div>
        <div class="relative" data-profile>
          <button type="button" class="flex items-center gap-2 pl-1.5 pr-1.5 py-1.5 rounded-xl transition-colors duration-150 hover:bg-sunken" data-profile-btn>
            <span class="avatar w-8 h-8 text-[13px]" data-profile-avatar>U</span>
            <span class="hidden xl:block text-sm font-semibold text-ink-800 max-w-[110px] truncate" data-profile-name></span>
          </button>
          <div class="absolute right-0 top-full mt-2 z-50" data-profile-panel></div>
        </div>
        <button type="button" aria-label="Toggle menu" aria-expanded="false" class="xl:hidden w-9 h-9 rounded-lg flex items-center justify-center text-muted hover:bg-sunken" data-menu-btn>
          <span data-menu-open><span data-icon="Menu" data-icon-size="20"></span></span>
          <span class="hidden" data-menu-close><span data-icon="X" data-icon-size="20"></span></span>
        </button>
      </div>
    </div>
  </div>
</header>
<div class="xl:hidden" data-drawer-host></div>
<main id="page" class="flex-1"></main>
<footer class="hidden md:block border-t border-line bg-card mt-auto">
  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2.5">
      <span class="w-7 h-7 rounded-lg bg-primary text-white flex items-center justify-center text-[12px] font-extrabold">R</span>
      <p class="text-xs text-muted">© 2026 ReMarket · Trusted second-hand, campus wide.</p>
    </div>
    <nav class="flex items-center gap-5 text-xs font-semibold text-muted">
      <a href="products.html" class="hover:text-primary transition-colors">Explore</a>
      <a href="categories.html" class="hover:text-primary transition-colors">Categories</a>
      <a href="sell.html" class="hover:text-primary transition-colors">Sell</a>
      <a href="compare.html" class="hover:text-primary transition-colors">Compare</a>
    </nav>
  </div>
</footer>
</div>
<nav class="md:hidden fixed bottom-3 inset-x-3 z-40 bg-white/92 backdrop-blur-xl border border-line rounded-2xl shadow-pop flex items-stretch p-1.5 pb-[calc(0.375rem+env(safe-area-inset-bottom))]">
  <a href="index.html" data-tab data-to="/" class="relative flex-1 flex flex-col items-center gap-1 py-2 rounded-xl text-[10px] font-bold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="Store" data-icon-size="19"></span><span class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full text-[9px] font-bold flex items-center justify-center" data-badge></span></span>Home</a>
  <a href="products.html" data-tab data-to="/products" class="relative flex-1 flex flex-col items-center gap-1 py-2 rounded-xl text-[10px] font-bold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="Compass" data-icon-size="19"></span><span class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full text-[9px] font-bold flex items-center justify-center" data-badge></span></span>Explore</a>
  <a href="sell.html" data-tab data-to="/sell" class="relative flex-1 flex flex-col items-center gap-1 py-2 rounded-xl text-[10px] font-bold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="Sparkles" data-icon-size="19"></span><span class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full text-[9px] font-bold flex items-center justify-center" data-badge></span></span>Sell</a>
  <a href="cart.html" data-tab data-to="/cart" class="relative flex-1 flex flex-col items-center gap-1 py-2 rounded-xl text-[10px] font-bold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="ShoppingCart" data-icon-size="19"></span><span class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full text-[9px] font-bold flex items-center justify-center" data-badge></span></span>Cart</a>
  <a href="notifications.html" data-tab data-to="/notifications" class="relative flex-1 flex flex-col items-center gap-1 py-2 rounded-xl text-[10px] font-bold transition-colors duration-150"><span class="relative inline-flex"><span data-icon="Bell" data-icon-size="19"></span><span class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full text-[9px] font-bold flex items-center justify-center" data-badge></span></span>Alerts</a>
</nav>
</body>
</html>
